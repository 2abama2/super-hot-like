<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperHotLike</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="score-display">Score: 0</div>
        
        <div id="start-screen" class="menu">
            <h1>SUPER PROTOTYPE</h1>
            <p>Time moves only when you move or act.</p>
            <p>WASD to move. Mouse to look. Click to shoot.</p>
            <button id="start-btn">Click to Start</button>
        </div>

        <div id="game-over-screen" class="menu hidden">
            <h1>SHATTERED</h1>
            <p>You were hit.</p>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn">Click to Restart</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
